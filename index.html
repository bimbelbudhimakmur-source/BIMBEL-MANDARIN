<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Bimbel Budhi Makmur</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <!-- Brand -->
            <div class="brand">
                <div class="brand-chinese">興毅南興山口洋補習所</div>
                <div class="brand-name">BIMBEL BUDHI MAKMUR</div>
                <div class="brand-sub">Sistem Manajemen Internal</div>
            </div>

            <!-- Form -->
            <form id="loginForm">

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="nama@email.com" required />
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password" required />
                </div>

                <button type="submit" id="loginBtn">Masuk</button>

                <div id="errMsg" class="err-msg"></div>

            </form>

            <p class="hint">
            Lupa password? Hubungi Leader. &nbsp;·&nbsp;
            <a href="daftar.html" style="color:var(--red);font-weight:600;text-decoration:none">Daftar di sini →</a>
        </p>

        </div>

    </div>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
</body>
</html>
