<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Raport — Bimbel Budhi Makmur</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/supabase-client.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Times New Roman',serif;background:#f0f0f0;color:#222;}

    /* SCREEN UI */
    .ui{background:#fff;padding:16px 24px;border-bottom:2px solid #ddd;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
    .ui h2{font-size:16px;color:#b01020;width:100%;font-family:Arial,sans-serif;margin-bottom:4px;}
    .fg{display:flex;flex-direction:column;gap:3px;}
    .fg label{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;font-family:Arial,sans-serif;}
    .fg select,.fg input{padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;min-width:150px;font-family:Arial,sans-serif;}
    .btn{padding:9px 18px;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;}
    .btn-red{background:#b01020;color:#fff;}
    .btn-green{background:#059669;color:#fff;display:none;}
    #msg{font-family:Arial,sans-serif;font-size:13px;color:#6b7280;padding:30px;text-align:center;display:none;}

    /* PAGE */
    #pages{padding:24px;}
    .page{
      width:210mm;min-height:297mm;background:#fff;
      margin:0 auto 24px;padding:10mm 15mm 16mm;
      box-shadow:0 2px 12px rgba(0,0,0,.15);
      position:relative;page-break-after:always;break-after:page;
    }

    /* HEADER */
    .hdr{display:flex;align-items:center;gap:12px;border-bottom:3px double #b01020;padding-bottom:6px;margin-bottom:7px;}
    .hdr-txt h1{font-size:15px;color:#b01020;font-weight:bold;}
    .hdr-txt p{font-size:10px;color:#555;margin-top:1px;}
    .page-title{text-align:center;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;margin:6px 0 8px;color:#333;}

    /* INFO BOX */
    .info{border:1px solid #ccc;border-radius:4px;padding:6px 12px;margin-bottom:7px;display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;}
    .ir{display:flex;gap:6px;font-size:11px;}
    .il{color:#555;min-width:115px;}
    .iv{font-weight:bold;}

    /* SECTION */
    .sec{font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;color:#b01020;border-bottom:1px solid #b01020;padding-bottom:2px;margin:7px 0 4px;}

    /* TABLE */
    table{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:5px;}
    th{background:#b01020;color:#fff;padding:4px 7px;text-align:center;font-weight:bold;}
    th.tl{text-align:left;}
    td{padding:3px 7px;border:1px solid #ddd;}
    tr:nth-child(even) td{background:#fef8f8;}
    .tc{text-align:center;}
    .tw{font-weight:bold;}
    .sg{color:#059669;font-weight:bold;}
    .sy{color:#d97706;font-weight:bold;}
    .sr{color:#dc2626;font-weight:bold;}

    /* NILAI AKHIR BOX */
    .na-box{background:#fff8f8;border:2px solid #b01020;border-radius:6px;padding:8px 14px;margin:7px 0;display:flex;justify-content:space-between;align-items:center;}
    .na-box .na-label{font-size:13px;font-weight:bold;color:#b01020;}
    .na-box .na-val{font-size:28px;font-weight:bold;color:#b01020;}
    .na-box .na-pred{font-size:13px;color:#555;}

    /* ABSENSI GRID */
    .abs-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:5px;}
    .abs-card{border:1px solid #ddd;border-radius:4px;padding:4px;text-align:center;}
    .abs-val{font-size:18px;font-weight:bold;}
    .abs-lbl{font-size:9px;color:#555;margin-top:1px;}

    /* INFO TAMBAHAN */
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:5px;}

    /* PERILAKU */
    .perilaku-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
    .perilaku-opt{display:flex;align-items:center;gap:4px;font-size:11px;}
    .kotak{width:14px;height:14px;border:1px solid #333;display:inline-block;text-align:center;line-height:12px;font-size:10px;}

    /* CATATAN */
    .catatan{border:1px solid #ddd;border-radius:4px;padding:8px;min-height:72px;font-size:10px;color:#888;line-height:2.0;}

    /* TTD */
    .ttd{display:flex;justify-content:space-between;margin-top:10px;}
    .ttd-box{text-align:center;font-size:10px;}
    .ttd-line{margin:42px auto 6px;border-bottom:1px solid #555;width:110px;}

    /* FOOTER */
    .footer{position:absolute;bottom:8mm;left:15mm;right:15mm;border-top:1px solid #ddd;padding-top:4px;font-size:8px;color:#aaa;text-align:center;}

    /* 判定 */
    .hantei-box{margin:6px 0;border:1.5px solid #b01020;border-radius:5px;padding:6px 12px;background:#fff8f8;}
    .hantei-label{font-size:11px;font-weight:bold;color:#b01020;margin-bottom:4px;}
    .hantei-val{font-size:22px;font-weight:bold;color:#b01020;letter-spacing:2px;}
    .hantei-sub{font-size:10px;color:#555;margin-top:2px;}

    /* ===== CALISTUNG REPORT (lebih lega, isi sedikit) ===== */
    .cal-page{display:flex;flex-direction:column;min-height:calc(297mm - 26mm);}
    .cal-hdr{text-align:center;border-bottom:3px double #b01020;padding-bottom:8px;margin-bottom:14px;}
    .cal-hdr h1{font-size:19px;color:#b01020;font-weight:bold;letter-spacing:1px;}
    .cal-hdr p{font-size:11px;color:#666;margin-top:2px;}
    .cal-title{text-align:center;font-size:15px;font-weight:bold;text-transform:uppercase;letter-spacing:2px;margin:0 0 16px;color:#333;}
    .cal-title span{display:block;font-size:11px;font-weight:normal;letter-spacing:0;margin-top:3px;color:#666;}

    .cal-info{border:1px solid #ccc;border-radius:6px;padding:12px 20px;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:7px 20px;font-family:Arial,sans-serif;}
    .cal-ir{display:flex;gap:6px;font-size:12px;}
    .cal-il{color:#555;min-width:95px;flex-shrink:0;}
    .cal-iv{font-weight:bold;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    .cal-nilai-wrap{margin-bottom:14px;}
    .cal-nilai-title{font-size:12px;font-weight:bold;color:#b01020;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #b01020;padding-bottom:3px;margin-bottom:10px;font-family:Arial,sans-serif;}
    .cal-nilai-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
    .cal-nilai-box{border:1.5px solid #b01020;border-radius:6px;padding:10px 6px;text-align:center;background:#fff8f8;}
    .cal-nilai-label{font-size:11px;color:#666;font-family:Arial,sans-serif;margin-bottom:4px;}
    .cal-nilai-val{font-size:24px;font-weight:bold;color:#b01020;}

    .cal-peringkat{text-align:center;margin:14px 0;padding:8px;background:#fff8f8;border:2px solid #b01020;border-radius:6px;}
    .cal-peringkat-label{font-size:11px;color:#666;font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;}
    .cal-peringkat-val{font-size:22px;font-weight:bold;color:#b01020;margin-top:2px;}

    .cal-keterangan{font-size:10px;color:#777;text-align:center;font-family:Arial,sans-serif;margin-bottom:14px;}

    .cal-saran-title{font-size:12px;font-weight:bold;color:#b01020;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #b01020;padding-bottom:3px;margin-bottom:8px;font-family:Arial,sans-serif;}
    .cal-saran-box{border:1px solid #ccc;border-radius:6px;padding:12px;min-height:70px;font-size:12px;line-height:1.7;color:#333;}

    .cal-ttd{display:flex;justify-content:space-between;margin-top:18px;padding-top:6px;}
    .cal-ttd-box{text-align:center;font-size:11px;font-family:Arial,sans-serif;}
    .cal-ttd-line{margin:36px auto 6px;border-bottom:1px solid #555;width:140px;}

    .cal-footer{text-align:center;font-size:8px;color:#aaa;margin-top:14px;padding-top:6px;border-top:1px solid #ddd;font-family:Arial,sans-serif;}

    @page{size:A4 portrait;margin:0;}
    @media print{
      *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
      body{background:#fff;}
      .ui{display:none!important;}
      #msg{display:none!important;}
      #hanteiPanel{display:none!important;}
      #pages{padding:0;}
      .page{box-shadow:none!important;margin:0!important;}
    }
  </style>
</head>
<body>

<div class="ui">
  <h2>🎓 Bimbel Budhi Makmur — Cetak Raport Murid</h2>
  <div class="fg"><label>班级 Kelas</label><select id="selKelas"><option value="">-- Pilih --</option></select></div>
  <div class="fg"><label>Semester</label>
    <select id="selSem"><option value="1">Semester 1</option><option value="2">Semester 2</option></select>
  </div>
  <div class="fg"><label>学年 Tahun Ajaran</label><input id="selTahun" placeholder="cth: 2025"></div>
  <button class="btn btn-red" onclick="generate()">📊 Generate Raport</button>
  <button class="btn btn-green" id="btnPrint" onclick="doPrint()">🖨️ Print / Download PDF</button>
</div>

<!-- Panel 判定 per murid — muncul setelah generate -->
<div id="hanteiPanel" style="display:none;background:#fff;border-bottom:2px solid #ddd;padding:14px 24px;font-family:Arial,sans-serif">
  <div style="font-size:13px;font-weight:700;color:#b01020;margin-bottom:10px">判定 (Penentuan Naik/Tidak Naik Kelas) — atur sebelum print</div>
  <div id="hanteiList" style="display:flex;flex-wrap:wrap;gap:10px"></div>
</div>

<div id="msg"></div>
<div id="pages"></div>

<script>
let kelasList=[], guruNama='';

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(!session){window.location.href='../index.html';return;}
  const {data:prof}=await db.from('profiles').select('*').eq('id',session.user.id).single();
  if(!prof){window.location.href='../index.html';return;}

  // Set default
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+1;
  document.getElementById('selTahun').value = String(y);
  document.getElementById('selSem').value = m<=6?'1':'2';

  // Load kelas
  let q=db.from('kelas').select('id,kode_kelas,jilid,nama_level,program:program_id(kode),guru:guru_id(id,nama_lengkap)').eq('is_active',true).order('kode_kelas');
  if(['teacher_mandarin','teacher_calistung','teacher_sd'].includes(prof.role)){
    const {data:g}=await db.from('guru').select('id').eq('profile_id',prof.id).single();
    if(g) q=q.eq('guru_id',g.id);
  }
  const {data:kls}=await q;
  kelasList=kls||[];
  const sel=document.getElementById('selKelas');
  kelasList.forEach(k=>{
    const o=document.createElement('option');
    o.value=k.id;
    const isMandarinKelas = !k.program || k.program.kode==='MANDARIN';
    o.textContent=k.kode_kelas+(isMandarinKelas ? ' (Jilid '+(k.jilid===0||k.jilid==='0'?'TK':k.jilid)+')' : (k.nama_level ? ' ('+k.nama_level+')' : ''));
    sel.appendChild(o);
  });
})();

function setMsg(t){const el=document.getElementById('msg');el.style.display=t?'block':'none';el.textContent=t||'';}

window.addEventListener('beforeprint', function(){
  const p = document.getElementById('hanteiPanel');
  if (p) p.style.setProperty('display','none','important');
});
window.addEventListener('afterprint', function(){
  const p = document.getElementById('hanteiPanel');
  if (p && p.dataset.hadContent === '1') p.style.display = 'block';
});

function doPrint(){
  const p = document.getElementById('hanteiPanel');
  if (p) p.style.setProperty('display','none','important');
  window.print();
}

async function generate(){
  const kelasId=document.getElementById('selKelas').value;
  const sem=document.getElementById('selSem').value;
  const tahun=document.getElementById('selTahun').value.trim();
  if(!kelasId||!tahun){alert('Pilih kelas dan isi tahun ajaran!');return;}

  const kelas=kelasList.find(k=>k.id===kelasId);
  const isMandarinKelas = !kelas.program || kelas.program.kode==='MANDARIN';

  if (!isMandarinKelas) {
    return generateCalistung(kelas, sem, tahun);
  }

  setMsg('⏳ Memuat data...');
  document.getElementById('pages').innerHTML='';
  document.getElementById('btnPrint').style.display='none';
  document.getElementById('hanteiPanel').style.display='none';

  const jlbl=(kelas.jilid===0||kelas.jilid==='0'?'TK':'Jilid '+kelas.jilid);
  const semLabel='Semester '+sem+' — '+tahun;
  // Sem 1: Jan-Jun | Sem 2: Jul-Des (tahun yang sama, format YYYY)
  const tglMulai=sem==='1'?tahun+'-01-01':tahun+'-07-01';
  const tglAkhir=sem==='1'?tahun+'-06-30':tahun+'-12-31';
  const semStr='Semester '+sem;

  // Load enrollment
  const {data:enroll}=await db.from('enrollment')
    .select('siswa:siswa_id(id,nomor_induk,nama_lengkap,nama_mandarin,status)')
    .eq('kelas_id',kelasId).eq('is_active',true);
  const murid=(enroll||[]).filter(e=>e.siswa?.status);
  if(!murid.length){setMsg('Tidak ada murid aktif di kelas ini.');return;}

  const siswaIds=murid.map(e=>e.siswa.id);

  // Load nilai dari nilai_detail (integer semester)
  const {data:nilaiAll}=await db.from('nilai_detail')
    .select('*')
    .eq('kelas_id',kelasId).eq('semester',parseInt(sem))
    .in('siswa_id',siswaIds);

  // Load absensi
  const {data:absAll}=await db.from('absensi')
    .select('siswa_id,tanggal,hadir,catatan')
    .eq('kelas_id',kelasId)
    .gte('tanggal',tglMulai).lte('tanggal',tglAkhir)
    .in('siswa_id',siswaIds);

  // Load perilaku per murid dari DB
  const {data:perilakuAll}=await db.from('penilaian_perilaku')
    .select('siswa_id,nilai')
    .eq('kelas_id',kelasId).eq('semester',parseInt(sem))
    .in('siswa_id',siswaIds);
  const perilakuMap={};
  (perilakuAll||[]).forEach(p=>{perilakuMap[p.siswa_id]=p.nilai;});

  const totalPertemuan=new Set((absAll||[]).map(a=>a.tanggal)).size;
  const today=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  const rp=(v,d=1)=>v!=null?Number(v).toFixed(d):'-';
  const sc=v=>{const n=Number(v);return n>=80?'sg':n>=60?'sy':'sr';};
  const avg=arr=>{const v=arr.filter(x=>x!=null&&x!=='');return v.length?v.reduce((a,b)=>a+Number(b),0)/v.length:null;};

  const pages=document.getElementById('pages');
  // Track siswa ids for 判定 panel
  const muridList=[];

  murid.forEach(e=>{
    const s=e.siswa;
    const perilaku=perilakuMap[s.id]||'—';
    const nilaiMurid=(nilaiAll||[]).filter(n=>n.siswa_id===s.id);
    const absMurid=(absAll||[]).filter(a=>a.siswa_id===s.id);

    // ====== ABSENSI ======
    const tidakHadir=absMurid.filter(a=>!a.hadir);
    const sakit=tidakHadir.filter(a=>a.catatan==='sakit').length;
    const izin=tidakHadir.filter(a=>a.catatan==='izin').length;
    const tanpaKet=tidakHadir.filter(a=>a.catatan!=='sakit'&&a.catatan!=='izin').length;
    const hadir=totalPertemuan-sakit-izin-tanpaKet;
    const nilaiKehadiran=totalPertemuan>0?(hadir/totalPertemuan)*100*0.05:0;

    // ====== AMBIL NILAI PER JENIS ======
    const getNilai=(jenis)=>{
      const entries=nilaiMurid.filter(n=>n.jenis_penilaian===jenis);
      const vals=[];
      entries.forEach(n=>{
        if(n.nilai!=null) vals.push(Number(n.nilai));
      });
      return avg(vals);
    };

    const getNilaiDetail=(jenis)=>{
      const entries=nilaiMurid.filter(n=>n.jenis_penilaian===jenis);
      const rows=[];
      entries.forEach(n=>{
        rows.push({label:n.sub_jenis||'—', range_bab:n.range_bab||null, nilai:n.nilai});
      });
      return rows;
    };

    const vTingxie=getNilai('tingxie');
    const vLianxi =getNilai('lianxi');
    const vCeyuan =getNilai('ceyuan');
    const vPinyin =getNilai('pinyin');
    const vZaoju  =getNilai('zaoju');

    const na_tingxie=vTingxie!=null?vTingxie*0.10:null;
    const na_lianxi =vLianxi!=null ?vLianxi*0.10 :null;
    const na_ceyuan =vCeyuan!=null ?vCeyuan*0.15 :null;
    const na_pinyin =vPinyin!=null ?vPinyin*0.15 :null;
    const na_zaoju  =vZaoju!=null  ?vZaoju*0.10  :null;

    const dakaoEntries=nilaiMurid.filter(n=>n.jenis_penilaian==='dakao');
    const dakaoByJenis={};
    dakaoEntries.forEach(n=>{
      if(n.nilai!=null){
        if(!dakaoByJenis[n.sub_jenis]) dakaoByJenis[n.sub_jenis]=[];
        dakaoByJenis[n.sub_jenis].push(Number(n.nilai));
      }
    });
    const dakaoVals=Object.values(dakaoByJenis).map(v=>avg(v)).filter(v=>v!=null);
    const vDakao=dakaoVals.length?avg(dakaoVals):null;
    const na_dakao=vDakao!=null?vDakao*0.35:null;

    const komponen=[na_tingxie,na_lianxi,na_ceyuan,na_pinyin,na_zaoju];
    const sub65=komponen.filter(v=>v!=null).reduce((a,b)=>a+b,0)+nilaiKehadiran;
    const totalNilai=na_dakao!=null?sub65+na_dakao:sub65;

    const pred=v=>{const n=Number(v);return n>=90?'A':n>=80?'B':n>=70?'C':n>=60?'D':'E';};

    const tingshuo=getNilaiDetail('tingshuo');
    const tingshuoAvg=(()=>{
      const bucketMap={ting:'ting',shuo:'shuo',du:'du',xie:'xie',xiehanzi:'xie',bishun:'xie',shubihua:'xie'};
      const order=['ting','shuo','du','xie'];
      const labelMap={ting:'听 (Tīng)',shuo:'说 (Shuō)',du:'读 (Dú)',xie:'写 (Xiě)'};
      const grouped={};
      tingshuo.forEach(r=>{
        if(r.nilai==null||!r.label) return;
        const bucket=bucketMap[r.label]||r.label;
        if(!grouped[bucket]) grouped[bucket]=[];
        grouped[bucket].push(Number(r.nilai));
      });
      return order.filter(k=>grouped[k]&&grouped[k].length).map(k=>({
        label: labelMap[k]||k,
        nilai: grouped[k].reduce((a,b)=>a+b,0)/grouped[k].length
      }));
    })();
    const yanjiang=getNilaiDetail('yanjiang');

    const nilaiRow=(label,nilaiMentah,bobot,nilaiAkhir)=>`<tr>
      <td>${label}</td><td class="tc">${bobot}</td>
      <td class="tc">${nilaiMentah!=null?rp(nilaiMentah,1):'-'}</td>
      <td class="tc">${nilaiMentah!=null?rp(nilaiMentah,1):'-'}</td>
      <td class="tc ${nilaiAkhir!=null?sc(nilaiAkhir*10):''}">${ nilaiAkhir!=null?rp(nilaiAkhir,2):'-'}</td>
    </tr>`;

    muridList.push({id:s.id, nama:s.nama_lengkap});

    const perilakuLabel={'A':'A — Sangat Baik','B':'B — Baik','C':'C — Cukup','D':'D — Perlu Bimbingan'};

    const page=`<div class="page" id="page_${s.id}">

          <tr style="font-weight:bold;background:#fef2f2">
            <td colspan="4">小计 Subtotal (65%)</td>
            <td class="tc ${sc(sub65)}">${rp(sub65,2)}</td>
          </tr>
          <tr style="background:#fff8f8">
            <td colspan="2">大考 (Dà kǎo) — 35%</td>
            <td class="tc" colspan="2">
              ${(()=>{const h={'zhongwen':'中文','pinyin':'拼音','zaoju':'造句','tingxie':'听写','lianxi':'练习','ceyuan':'测验','yanjiang':'演讲','tingshuo':'听说读写'};return Object.entries(dakaoByJenis).map(([k,v])=>'<span style="margin-right:8px">'+(h[k]||k)+': <b>'+(avg(v)!=null?rp(avg(v),1):'—')+'</b></span>').join('')+(dakaoVals.length?'&nbsp;→ 平均: <b>'+rp(vDakao,1)+'</b>':'—');})()}
            </td>
            <td class="tc ${na_dakao!=null?sc(na_dakao):''}">${ na_dakao!=null?rp(na_dakao,2):'—'}</td>
          </tr>
        </tbody>
      </table>

      <!-- NILAI PEROLEHAN -->
      <div class="na-box">
        <div>
          <div class="na-label">总成绩 NILAI PEROLEHAN</div>
          <div class="na-pred">Predikat: <b>${pred(totalNilai)}</b> &nbsp;|&nbsp; ${totalNilai>=80?'Sangat Baik':totalNilai>=70?'Baik':totalNilai>=60?'Cukup':'Perlu Bimbingan'}</div>
        </div>
        <div class="na-val ${sc(totalNilai)}">${rp(totalNilai,1)}</div>
      </div>

      <!-- INFO TAMBAHAN -->
      <div class="info-grid">
        <div>
          <div class="sec" style="margin-top:0">听说读写</div>
          <table>
            <thead><tr><th class="tl">Komponen</th><th>Nilai</th></tr></thead>
            <tbody>
              ${tingshuoAvg.length
                ? tingshuoAvg.map(r=>{
                    const v=Number(r.nilai).toFixed(1);
                    return `<tr><td>${r.label}</td><td class="tc ${sc(Number(r.nilai))}">${v}</td></tr>`;
                  }).join('')
                : '<tr><td colspan="2" style="text-align:center;color:#9ca3af">Belum ada data</td></tr>'
              }

            </tbody>
          </table>
        </div>
        <div>
          <div class="sec" style="margin-top:0">演讲 (Yǎn jiǎng)</div>
          <table>
            <thead><tr><th class="tl">Sesi</th><th>Nilai</th></tr></thead>
            <tbody>
              ${yanjiang.length?yanjiang.map(r=>`<tr><td>${r.label}</td><td class="tc ${r.nilai!=null?sc(r.nilai):''}">${r.nilai??'—'}</td></tr>`).join('')
              :`<tr><td colspan="2" class="tc" style="color:#aaa">Belum ada data</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <!-- KEHADIRAN, PERILAKU & 判定 -->
      <div class="info-grid">
        <div>
          <div class="sec" style="margin-top:0">出勤情况 Kehadiran</div>
          <div class="abs-grid" style="grid-template-columns:repeat(4,1fr)">
            <div class="abs-card"><div class="abs-val sg">${hadir}</div><div class="abs-lbl">✅ Hadir</div></div>
            <div class="abs-card"><div class="abs-val" style="color:#8b5cf6">${sakit}</div><div class="abs-lbl">🤒 Sakit</div></div>
            <div class="abs-card"><div class="abs-val" style="color:#3b82f6">${izin}</div><div class="abs-lbl">📋 Izin</div></div>
            <div class="abs-card"><div class="abs-val sr">${tanpaKet}</div><div class="abs-lbl">❌ Tanpa Ket.</div></div>
          </div>
          <div style="font-size:9px;color:#888;margin-top:2px">Total pertemuan: <b>${totalPertemuan} sesi</b></div>
        </div>
        <div>
          <div class="sec" style="margin-top:0">品德评估 Nilai Perilaku</div>
          <div style="display:flex;gap:10px;margin:6px 0;flex-wrap:wrap">
            ${['A','B','C','D'].map(p=>`<div style="display:flex;align-items:center;gap:4px;font-size:12px">
              <div style="width:16px;height:16px;border:1.5px solid #333;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;color:#b01020">${p===perilaku?'✓':''}</div>
              <span>${p}</span>
            </div>`).join('')}
          </div>
          <div style="font-size:10px;color:#555">${perilakuLabel[perilaku]||'—'}</div>
        </div>
      </div>

      <!-- 判定 -->
      <div class="hantei-box" style="padding:5px 10px;display:flex;align-items:center;gap:12px">
        <div class="hantei-label" style="margin-bottom:0;min-width:80px">判定 (Penentuan):</div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <div class="hantei-val" id="hantei_val_${s.id}" style="font-size:18px">—</div>
          <div class="hantei-sub" id="hantei_sub_${s.id}" style="color:#888;font-size:10px">Belum ditentukan</div>
        </div>
      </div>

      <!-- CATATAN -->
      <div class="sec">班主任评语 Catatan Wali Kelas</div>
      <div class="catatan" style="min-height:62px;display:flex;flex-direction:column;justify-content:space-around">
        <div style="border-bottom:1px solid #ccc;height:16px"></div>
        <div style="border-bottom:1px solid #ccc;height:16px"></div>
        <div style="border-bottom:1px solid #ccc;height:16px"></div>
      </div>

      <!-- TTD -->
      <div class="ttd">
        <div class="ttd-box">
          <div>家长确认 / 监护人</div>
          <div class="ttd-line"></div>
          <div>( ________________________ )</div>
        </div>
        <div class="ttd-box">
          <div>Singkawang, ${today}</div>
          <div>班主任</div>
          <div class="ttd-line"></div>
          <div>( ${kelas.guru?.nama_lengkap||'______________'} )</div>
        </div>
      </div>

      <div class="footer">Budhi Makmur Mandarin &nbsp;·&nbsp; ${semLabel} &nbsp;·&nbsp; Dicetak: ${today}</div>
    </div>`;

    pages.innerHTML+=page;
  });

  // Build 判定 panel — hanya bulan akhir semester
  const bulanNow = new Date().getMonth() + 1;
  const { data: ov } = await db.from('system_settings').select('value').eq('key','override_perilaku').maybeSingle();
  const hanteiAktif = [5,6,7,11,12,1].includes(bulanNow) || (ov && ov.value === 'true');
  const panel = document.getElementById('hanteiPanel');
  const list  = document.getElementById('hanteiList');

  if (!hanteiAktif) {
    list.innerHTML = '<div style="font-size:12px;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 16px;width:100%">'
      + '\uD83D\uDD12 <strong>判定 terkunci.</strong> Penentuan naik/tinggal kelas hanya bisa dilakukan pada bulan Mei, Juni, Juli (Sem 1) dan November, Desember, Januari (Sem 2).'
      + '</div>';
  } else {
    list.innerHTML = muridList.map(function(m) { return (
      '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px 14px;min-width:200px">'
      + '<div style="font-size:12px;font-weight:700;margin-bottom:6px;color:#374151">' + m.nama + '</div>'
      + '<div style="display:flex;gap:8px">'
      + '<button onclick="setHantei(\'' + m.id + '\',\'\u5347\u73ED\')" id="btn_sheng_' + m.id + '" style="flex:1;padding:6px;border:1.5px solid #b01020;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;color:#b01020">\u5347\u73ED</button>'
      + '<button onclick="setHantei(\'' + m.id + '\',\'\u7559\u73ED\')" id="btn_liu_' + m.id + '" style="flex:1;padding:6px;border:1.5px solid #6b7280;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;color:#6b7280">\u7559\u73ED</button>'
      + '</div></div>'
    ); }).join('');
  }
  panel.style.display = 'block';
  panel.dataset.hadContent = '1';

  setMsg('');
  document.getElementById('btnPrint').style.display = 'inline-block';
}

async function setHantei(siswaId, val) {
  const valEl = document.getElementById('hantei_val_'+siswaId);
  const subEl = document.getElementById('hantei_sub_'+siswaId);
  if (valEl) { valEl.textContent = val; valEl.style.color = val==='升班'?'#059669':'#dc2626'; }
  if (subEl) { subEl.textContent = val==='升班'?'Naik Kelas':'Tidak Naik Kelas'; subEl.style.color = val==='升班'?'#059669':'#dc2626'; }
  const btnSheng = document.getElementById('btn_sheng_'+siswaId);
  const btnLiu   = document.getElementById('btn_liu_'+siswaId);
  if (btnSheng) { btnSheng.style.background = val==='升班'?'#b01020':'#fff'; btnSheng.style.color = val==='升班'?'#fff':'#b01020'; }
  if (btnLiu)   { btnLiu.style.background   = val==='留班'?'#374151':'#fff'; btnLiu.style.color   = val==='留班'?'#fff':'#6b7280'; }

  // Simpan hantei ke DB (penilaian_perilaku.hantei)
  try {
    await db.from('penilaian_perilaku')
      .update({ hantei: val, updated_at: new Date().toISOString() })
      .eq('siswa_id', siswaId);
  } catch(e) { console.warn('setHantei DB save failed:', e); }
}

// ============================================
// RAPORT CALISTUNG (Membaca/Menulis/Dikte/Berhitung)
// ============================================
const CAL_GRADE_WEIGHT = { 'A':9, 'A-':8, 'B+':7, 'B':6, 'B-':5, 'C+':4, 'C':3, 'C-':2, 'D':1 };

async function generateCalistung(kelas, sem, tahun) {
  setMsg('⏳ Memuat data...');
  document.getElementById('pages').innerHTML='';
  document.getElementById('btnPrint').style.display='none';
  document.getElementById('hanteiPanel').style.display='none';

  const semLabel = sem==='1' ? 'Ganjil' : 'Genap';
  const today=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});

  // Load enrollment (murid aktif di kelas ini)
  const {data:enroll}=await db.from('enrollment')
    .select('siswa:siswa_id(id,nomor_induk,nama_lengkap,status)')
    .eq('kelas_id',kelas.id).eq('is_active',true);
  const murid=(enroll||[]).filter(e=>e.siswa?.status);
  if(!murid.length){setMsg('Tidak ada murid aktif di kelas ini.');return;}

  const siswaIds=murid.map(e=>e.siswa.id);

  // Load nilai dari penilaian_calistung
  const {data:nilaiAll}=await db.from('penilaian_calistung')
    .select('*').eq('kelas_id',kelas.id).eq('semester',parseInt(sem)).eq('tahun_ajaran',tahun)
    .in('siswa_id',siswaIds);
  const nilaiMap={};
  (nilaiAll||[]).forEach(n=>{nilaiMap[n.siswa_id]=n;});

  // Hitung peringkat (total skor tiap murid di kelas ini)
  const scored = murid.map(e=>{
    const n = nilaiMap[e.siswa.id] || {};
    const total = (CAL_GRADE_WEIGHT[n.membaca]||0)+(CAL_GRADE_WEIGHT[n.menulis]||0)+(CAL_GRADE_WEIGHT[n.dikte]||0)+(CAL_GRADE_WEIGHT[n.berhitung]||0);
    return { siswaId: e.siswa.id, total };
  });
  const ranked = [...scored].sort((a,b)=>b.total-a.total);
  const rankMap = {};
  ranked.forEach((r,i)=>{ rankMap[r.siswaId] = r.total>0 ? (i+1) : null; });

  const pages=document.getElementById('pages');

  murid.forEach(e=>{
    const s=e.siswa;
    const n=nilaiMap[s.id]||{};
    const peringkat=rankMap[s.id];

    const page=`<div class="page" id="page_${s.id}">
      <div class="cal-page">
      <!-- Header -->
      <div class="cal-hdr">
        <h1>BIMBEL BUDHI MAKMUR CALISTUNG</h1>
        <p>Laporan Hasil Belajar Murid</p>
      </div>
      <div class="cal-title">LAPORAN HASIL BELAJAR<span>Semester ${semLabel} — ${tahun}</span></div>

      <!-- Info Murid -->
      <div class="cal-info">
        <div class="cal-ir"><span class="cal-il">Nama</span><span class="cal-iv">${s.nama_lengkap}</span></div>
        <div class="cal-ir"><span class="cal-il">No. Induk</span><span class="cal-iv">${s.nomor_induk}</span></div>
        <div class="cal-ir"><span class="cal-il">Semester</span><span class="cal-iv">${semLabel}</span></div>
        <div class="cal-ir"><span class="cal-il">Tahun Ajaran</span><span class="cal-iv">${tahun}</span></div>
        <div class="cal-ir"><span class="cal-il">Kelas</span><span class="cal-iv">${kelas.kode_kelas}</span></div>
        <div class="cal-ir"><span class="cal-il">Guru Pendamping</span><span class="cal-iv">${kelas.guru?.nama_lengkap||'—'}</span></div>
      </div>

      <!-- NILAI -->
      <div class="cal-nilai-wrap">
        <div class="cal-nilai-title">Hasil Penilaian</div>
        <div class="cal-nilai-grid">
          <div class="cal-nilai-box"><div class="cal-nilai-label">Membaca</div><div class="cal-nilai-val">${n.membaca||'—'}</div></div>
          <div class="cal-nilai-box"><div class="cal-nilai-label">Menulis</div><div class="cal-nilai-val">${n.menulis||'—'}</div></div>
          <div class="cal-nilai-box"><div class="cal-nilai-label">Dikte</div><div class="cal-nilai-val">${n.dikte||'—'}</div></div>
          <div class="cal-nilai-box"><div class="cal-nilai-label">Berhitung</div><div class="cal-nilai-val">${n.berhitung||'—'}</div></div>
        </div>
      </div>

      <div class="cal-peringkat">
        <div class="cal-peringkat-label">Peringkat di Kelas</div>
        <div class="cal-peringkat-val">${peringkat??'—'}</div>
      </div>

      <div class="cal-keterangan">Keterangan : A (Sangat bagus) &nbsp;·&nbsp; A- / B+ / B / B- (Bagus) &nbsp;·&nbsp; C+ / C / C- (Cukup) &nbsp;·&nbsp; D (Kurang)</div>

      <div class="cal-nilai-wrap">
        <div class="cal-nilai-title">Ketidakhadiran</div>
        <div class="cal-nilai-grid" style="grid-template-columns:repeat(3,1fr)">
          <div class="cal-nilai-box"><div class="cal-nilai-label">🤒 Sakit</div><div class="cal-nilai-val" style="font-size:22px">${n.sakit||0}</div></div>
          <div class="cal-nilai-box"><div class="cal-nilai-label">📋 Izin</div><div class="cal-nilai-val" style="font-size:22px">${n.izin||0}</div></div>
          <div class="cal-nilai-box"><div class="cal-nilai-label">❌ Tanpa Ket.</div><div class="cal-nilai-val" style="font-size:22px">${n.tanpa_keterangan||0}</div></div>
        </div>
      </div>

      <!-- SARAN -->
      <div class="cal-saran-title">Saran</div>
      <div class="cal-saran-box">${n.saran||''}</div>

      <!-- TTD -->
      <div class="cal-ttd">
        <div class="cal-ttd-box">
          <div>Guru Pendamping</div>
          <div class="cal-ttd-line"></div>
          <div>( ${kelas.guru?.nama_lengkap||'______________'} )</div>
        </div>
        <div class="cal-ttd-box">
          <div>Singkawang, ${today}</div>
          <div>Kepala Sekolah</div>
          <div class="cal-ttd-line"></div>
          <div>( ________________________ )</div>
        </div>
      </div>

      <div class="cal-footer">Bimbel Budhi Makmur Calistung &nbsp;·&nbsp; Semester ${semLabel} ${tahun} &nbsp;·&nbsp; Dicetak: ${today}</div>
      </div>
    </div>`;

    pages.innerHTML+=page;
  });

  setMsg('');
  document.getElementById('btnPrint').style.display='inline-block';
}
</script>
</body>
